
# ============================================================
# WORKFLOW: NEXT.JS BUILD INFORMATION DEMO
# ============================================================

# Workflow name shown in GitHub Actions.
name: Next.js Build Information Demo


# ============================================================
# TRIGGERS
# ============================================================

on:

  # Run when code is pushed to main.
  push:
    branches:
      - main

  # Allow manual workflow execution.
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

# Allow the workflow to read repository information.
permissions:
  contents: read


# ============================================================
# JOBS
# ============================================================

jobs:

  generate-build-info:

    # GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    steps:


      # ------------------------------------------------------
      # STEP 1: CHECKOUT REPOSITORY
      # ------------------------------------------------------

      # Download the repository source code.
      - name: Checkout Repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # STEP 2: SETUP NODE.JS
      # ------------------------------------------------------

      # Install Node.js so we can read package.json.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"


      # ------------------------------------------------------
      # STEP 3: CALL OUR COMPOSITE ACTION
      # ------------------------------------------------------

      - name: Generate Build Information

        # Give this step an ID to access its outputs.
        id: build-info

        # Local path to our Composite Action.
        uses: ./.github/actions/generate-build-info

        # Pass the application name to the action.
        with:
          app-name: Better Auth Learning


      # ------------------------------------------------------
      # STEP 4: DISPLAY ACTION OUTPUT
      # ------------------------------------------------------

      - name: Display Generated File Path

        # Access the output returned by our Composite Action.
        run: |
          echo "Generated file: ${{ steps.build-info.outputs.build-info-file }}"


      # ------------------------------------------------------
      # STEP 5: UPLOAD BUILD INFORMATION AS ARTIFACT
      # ------------------------------------------------------

      - name: Upload Build Information

        # Official GitHub artifact upload action.
        uses: actions/upload-artifact@v7

        with:

          # Name used to identify the uploaded artifact.
          name: nextjs-build-information

          # File generated by our Composite Action.
          path: ${{ steps.build-info.outputs.build-info-file }}

          # Fail if the file does not exist.
          if-no-files-found: error
