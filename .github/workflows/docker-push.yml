
# Workflow name
name: Next.js Docker CI/CD

# Trigger when code is pushed to main
on:
  push:
    branches:
      - main

# Repository permissions
permissions:
  contents: read

jobs:
  docker-build-push:
    # GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Download repository code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # STEP 2: Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # STEP 3: Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # STEP 4: Generate Prisma Client
      - name: Generate Prisma Client
        run: npx prisma generate

      # STEP 5: Build Next.js application
      - name: Build Next.js Application
        run: npm run build

      # STEP 6: Configure Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 7: Login to private Docker Hub repository
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 8: Build and push Next.js Docker image
      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          # Use the current repository as build context
          context: .

          # Push image to Docker Hub
          push: true

          # Publish latest and commit-specific tags
          tags: |
            banothsrikanth015/better-auth-gitactions:latest
            banothsrikanth015/better-auth-gitactions:${{ github.sha }}

      # STEP 9: Pull the published image onto the runner
      - name: Pull Docker Image
        run: |
          docker pull banothsrikanth015/better-auth-gitactions:${{ github.sha }}

      # STEP 10: Run Next.js Docker container
      - name: Run Docker Container
        run: |
          docker run -d \
            --name nextjs-container \
            -p 3000:3000 \
            banothsrikanth015/better-auth-gitactions:${{ github.sha }}

      # STEP 11: Verify container
      - name: Verify Docker Container
        run: |
          docker ps
          docker logs nextjs-container
