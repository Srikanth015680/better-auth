
# Workflow name displayed in the GitHub Actions tab
name: Next.js Docker CI/CD

# Define when this workflow should execute
on:
  # Trigger workflow whenever code is pushed
  push:
    # Only execute when code is pushed to main branch
    branches:
      - main

# Define permissions granted to the workflow's GITHUB_TOKEN
permissions:
  # Allow workflow to read repository contents
  contents: read

# Define all automation jobs
jobs:

  # Job identifier: Docker build and push
  docker-build-push:

    # Select GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Define steps executed sequentially inside this job
    steps:

      # STEP 1: Checkout repository
      # Downloads your GitHub repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v6

      # STEP 2: Setup Node.js
      # Installs/configures Node.js 22 on the runner
      # Enables npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # STEP 3: Install Dependencies
      # npm ci installs exact dependencies from package-lock.json
      # Provides a clean and reproducible installation
      - name: Install Dependencies
        run: npm ci

      # STEP 4: Generate Prisma Client
      # Generates Prisma Client based on your Prisma schema
      # Makes Prisma Client available to your Next.js application
      - name: Generate Prisma Client
        run: npx prisma generate

      # STEP 5: Build Next.js Application
      # Compiles and optimizes your Next.js application
      # Generates production build output in the .next directory
      # Standalone output is generated because output: standalone is configured
      - name: Build Next.js Application
        run: npm run build

      # STEP 6: Setup Docker Buildx
      # Configures Docker Buildx for advanced image building
      # Supports efficient and multi-platform Docker builds
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 7: Docker Login
      # Authenticates GitHub runner with Docker Hub
      # Username and token are securely read from GitHub Secrets
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 8: Docker Build and Push
      # Reads Dockerfile from the repository root
      # Builds the Docker image using the current repository
      # Pushes the image to Docker Hub
      # Creates two image tags: latest and commit SHA
      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          # Current repository is the Docker build context
          context: .

          # Upload the successfully built image to Docker Hub
          push: true

          # Docker image names and tags
          tags: |
            YOUR_DOCKERHUB_USERNAME/nextjs-app:latest
            YOUR_DOCKERHUB_USERNAME/nextjs-app:${{ github.sha }}

      # STEP 9: Run Docker Container
      # Starts a container from the image built and pushed above
      # -d runs the container in detached/background mode
      # --name assigns a name to the container
      # -p maps runner port 3000 to container port 3000
      - name: Run Docker Container
        run: |
          docker run -d \
            --name nextjs-container \
            -p 3000:3000 \
            YOUR_DOCKERHUB_USERNAME/nextjs-app:${{ github.sha }}

      # STEP 10: Verify Docker Container
      # docker ps displays currently running containers
      # docker logs displays application container logs
      - name: Verify Docker Container
        run: |
          docker ps
          docker logs nextjs-container
