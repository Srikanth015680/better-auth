
name: Step Outputs Demo

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Generate an application version.
      - name: Generate Version
        id: version
        run: |
          APP_VERSION="1.0.5"

          # Save the value as a step output.
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      # Step 2: Read the output from Step 1.
      - name: Display Version
        run: |
          echo "Application Version: ${{ steps.version.outputs.app_version }}"

      # Step 3: Use the output in another command.
      - name: Build Application
        run: |
          echo "Building application version ${{ steps.version.outputs.app_version }}"
