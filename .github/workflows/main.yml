# ####### Resuable outputs



name: Main Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # Call the reusable workflow.
  reusable-build:
    uses: ./.github/workflows/reusable.yml

  # Receive the reusable workflow output.
  deploy:
    runs-on: ubuntu-latest

    # Wait for reusable-build to complete.
    needs: reusable-build

    steps:
      - name: Display Received Version
        run: |
          echo "Received version: ${{ needs.reusable-build.outputs.app_version }}"

      - name: Deployment Information
        run: |
          echo "Deploying version ${{ needs.reusable-build.outputs.app_version }}"
