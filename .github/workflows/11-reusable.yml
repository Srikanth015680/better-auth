
name: Reusable Build Workflow

# Allow another workflow to call this workflow.
on:
  workflow_call:

    # Declare outputs returned to the caller.
    outputs:
      app_version:
        description: "Generated application version"

        # Map the output to the build job output.
        value: ${{ jobs.build.outputs.app_version }}

jobs:
  build:
    runs-on: ubuntu-latest

    # Expose the step output as a job output.
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      # Generate application version.
      - name: Generate Application Version
        id: version
        run: |
          APP_VERSION="1.0.5"

          # Save the version as a step output.
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      # Display generated version.
      - name: Display Version
        run: |
          echo "Generated version: ${{ steps.version.outputs.app_version }}"
