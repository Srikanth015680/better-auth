
# Workflow name
name: Next.js Trigger Demo

# Define multiple workflow triggers
on:

  # Trigger 1: Push events
  push:
    # Only main and develop branches
    branches:
      - main
      - develop

    # Only relevant application files
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "next.config.ts"
      - "prisma.config.ts"

  # Trigger 2: Pull request events
  pull_request:
    # Only PRs targeting main
    branches:
      - main

    # Selected pull request activities
    types:
      - opened
      - synchronize
      - reopened

# Repository permissions
permissions:
  contents: read

# Define jobs
jobs:
  nextjs-ci:

    # Select Ubuntu runner
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Generate Prisma Client
      - name: Generate Prisma Client
        run: npx prisma generate

      # Build Next.js
      - name: Build Next.js
        run: npm run build
