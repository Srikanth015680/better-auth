
# Workflow name
name: GitHub Runner Variables

# Trigger workflow manually
on:
  workflow_dispatch:

# Define jobs
jobs:

  # Runner information job
  runner-info:

    # Select GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Define workflow steps
    steps:

      # Download repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Display operating system
      - name: Runner OS
        run: echo "OS: $RUNNER_OS"

      # Display CPU architecture
      - name: Runner Architecture
        run: echo "Architecture: $RUNNER_ARCH"

      # Display runner name
      - name: Runner Name
        run: echo "Runner: $RUNNER_NAME"

      # Display temporary directory
      - name: Runner Temp
        run: echo "Temp: $RUNNER_TEMP"

      # Display workspace directory
      - name: Runner Workspace
        run: echo "Workspace: $RUNNER_WORKSPACE"

      # Display tools cache directory
      - name: Runner Tool Cache
        run: echo "Tool Cache: $RUNNER_TOOL_CACHE"

      # Display runner environment
      - name: Runner Environment
        run: echo "Environment: $RUNNER_ENVIRONMENT"

      # Display GitHub repository workspace
      - name: GitHub Workspace
        run: echo "GitHub Workspace: $GITHUB_WORKSPACE"

      # Display all runner variables
      - name: Display Runner Information
        run: |
          echo "Operating System: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo "Runner Name: $RUNNER_NAME"
          echo "Temporary Directory: $RUNNER_TEMP"
          echo "Workspace: $RUNNER_WORKSPACE"
          echo "Tool Cache: $RUNNER_TOOL_CACHE"
          echo "Environment: $RUNNER_ENVIRONMENT"
          echo "GitHub Workspace: $GITHUB_WORKSPACE"
