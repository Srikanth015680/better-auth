
# Workflow name
name: GitHub Runner Variables

# Trigger workflow manually
on:
  workflow_dispatch:

# Define jobs
jobs:
  runner-info:
    runs-on: ubuntu-latest

    steps:
      # Display operating system
      - name: Runner OS
        run: echo "$RUNNER_OS"

      # Display CPU architecture
      - name: Runner Architecture
        run: echo "$RUNNER_ARCH"

      # Display runner name
      - name: Runner Name
        run: echo "$RUNNER_NAME"

      # Display temporary directory
      - name: Runner Temp
        run: echo "$RUNNER_TEMP"

      # Display workspace directory
      - name: Runner Workspace
        run: echo "$RUNNER_WORKSPACE"

      # Display tool cache
      - name: Runner Tool Cache
        run: echo "$RUNNER_TOOL_CACHE"

      # Display runner environment
      - name: Runner Environment
        run: echo "$RUNNER_ENVIRONMENT"

      # Display repository workspace
      - name: GitHub Workspace
        run: echo "$GITHUB_WORKSPACE"

      # Create a temporary file
      - name: Create Temporary File
        run: |
          echo "Next.js CI/CD Learning" > "$RUNNER_TEMP/nextjs-info.txt"
          cat "$RUNNER_TEMP/nextjs-info.txt"
