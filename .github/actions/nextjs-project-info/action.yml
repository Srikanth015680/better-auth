# ============================================================
# CUSTOM JAVASCRIPT ACTION: NEXT.JS PROJECT INFO
# ============================================================

# Name displayed when this action runs.
name: Next.js Project Information

# Explains what this action does.
description: Read and validate Next.js project information

# ============================================================
# INPUTS
# ============================================================

inputs:

  # Input 1: Location of the project's package.json.
  package-json:
    description: Path to the project's package.json file

    # The caller does not have to provide this value.
    required: false

    # Use package.json when no value is provided.
    default: package.json


# ============================================================
# OUTPUTS
# ============================================================

outputs:

  # Output 1: Name of the project.
  project-name:
    description: Name read from package.json

    # Get the value from the step identified as project-info.
    value: ${{ steps.project-info.outputs.project-name }}

  # Output 2: Version of the project.
  project-version:
    description: Version read from package.json
    value: ${{ steps.project-info.outputs.project-version }}

  # Output 3: Installed Next.js version.
  next-version:
    description: Next.js dependency version
    value: ${{ steps.project-info.outputs.next-version }}


# ============================================================
# EXECUTION CONFIGURATION
# ============================================================

runs:

  # Tell GitHub that this is a JavaScript Action.
  using: node24

  # JavaScript file that GitHub executes.
  # This file is generated by bundling index.js.
  main: dist/index.js